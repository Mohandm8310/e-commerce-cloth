{% extends 'base.html' %}

{% block title %}Server Error — StyleSphere{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <h1 class="display-1 fw-bold text-dark mb-2">500</h1>
    <h2 class="h4 fw-semibold mb-3">Internal Server Encountered an Issue</h2>
    <p class="text-muted small mb-4">Our engineering team has been notified. Please refresh or try again in a moment.</p>
    <a href="{{ url_for('products.home') }}" class="btn btn-dark px-4 py-2 text-uppercase letter-spacing-1 fw-bold">Back to Store</a>
</div>
{% endblock %}
