{% extends 'base.html' %}

{% block title %}Access Denied — StyleSphere{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <h1 class="display-1 fw-bold text-danger mb-2">403</h1>
    <h2 class="h4 fw-semibold mb-3">Administrator Privileges Required</h2>
    <p class="text-muted small mb-4">You do not have authorization to view this protected administrative resource.</p>
    <a href="{{ url_for('admin.login') }}" class="btn btn-dark px-4 py-2 text-uppercase letter-spacing-1 fw-bold">Sign In as Administrator</a>
</div>
{% endblock %}
