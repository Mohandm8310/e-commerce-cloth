services:
  - type: web
    name: stylesphere-ecommerce
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: MOCK_OTP
        value: "True"
      - key: MOCK_RAZORPAY
        value: "True"
